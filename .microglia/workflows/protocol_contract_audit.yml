version: "1.0"
id: "protocol_contract_audit"
name: "Auditoría de Contrato de Protocolo y Resiliencia de Gateway (glia-infra)"
description: "Verificación de handshake phx_join sincrónico, resiliencia ante caídas y límites de responsabilidad con glia-infra."

stages:
  - name: "Handshake Sincrónico Phoenix v2 (phx_join)"
    rules:
      - "synchronous_checked_continuation_join"
      - "handle_server_join_rejection_errors"
      - "connection_timeout_handling"
  - name: "Resiliencia y Mitigación DoS en Reconexión"
    rules:
      - "exponential_backoff_with_max_ceiling"
      - "prevent_gateway_reconnection_storms"
      - "voluntary_disconnect_cancels_reconnect"
  - name: "Frontera con glia-infra (Infraestructura y Backend)"
    rules:
      - "delegate_llm_keys_to_glia_infra"
      - "delegate_jwks_validation_to_runtime"
      - "delegate_database_silos_to_tenant_infra"
