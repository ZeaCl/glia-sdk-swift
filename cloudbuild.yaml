# ============================================================================
# cloudbuild.yaml — Glia Swift Client SDK (GliaSDK / GliaUI)
# ============================================================================
# GCP Cloud Build pipeline for Swift compilation & Microglia audit.
# ============================================================================

steps:
  # 1. Compilation and test suite on Linux with official Swift 6
  - name: '${_SWIFT_IMAGE}'
    id: swift-test
    entrypoint: swift
    args: ['test', '-v']

  # 2. Static security audit and compliance with Microglia
  - name: '${_MICROGLIA_IMAGE}'
    id: microglia-audit
    entrypoint: microglia
    args: ['scan', '.', '--sarif', 'reports/microglia.sarif']

substitutions:
  _REGION: southamerica-west1
  _SWIFT_IMAGE: 'swift:6.0-noble'
  _MICROGLIA_IMAGE: 'southamerica-west1-docker.pkg.dev/${PROJECT_ID}/zea/microglia:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
